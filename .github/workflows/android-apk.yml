name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Test and build Studio
        working-directory: studio
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Test desktop USB bridge
        working-directory: desktop-host
        run: npm test

      - name: Bundle Studio into Android assets
        run: |
          mkdir -p android-agent/app/src/main/assets/studio
          cp -R studio/dist/. android-agent/app/src/main/assets/studio/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aiphone-release.jks"

      - name: Run Android unit tests
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/aiphone-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android-agent testReleaseUnitTest --stacktrace

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/aiphone-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android-agent assembleRelease --stacktrace

      - name: Verify and name APK
        run: |
          APK="android-agent/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p artifacts
          cp "$APK" "artifacts/AIPhone-v0.1.${GITHUB_RUN_NUMBER}.apk"

      - name: Package standalone Studio
        run: |
          PACKAGE="artifacts/AIPhone-Studio-v0.1.${GITHUB_RUN_NUMBER}"
          mkdir -p "$PACKAGE/desktop-host" "$PACKAGE/studio"
          cp desktop-host/adb.mjs desktop-host/server.mjs desktop-host/package.json desktop-host/start-studio.cmd "$PACKAGE/desktop-host/"
          cp -R studio/dist "$PACKAGE/studio/"
          cp README.md "$PACKAGE/README.md"
          cd artifacts
          zip -r "AIPhone-Studio-v0.1.${GITHUB_RUN_NUMBER}.zip" "AIPhone-Studio-v0.1.${GITHUB_RUN_NUMBER}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIPhone-APK-v0.1.${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload standalone Studio
        uses: actions/upload-artifact@v4
        with:
          name: AIPhone-Studio-v0.1.${{ github.run_number }}
          path: artifacts/AIPhone-Studio-v0.1.${{ github.run_number }}.zip
          if-no-files-found: error
          retention-days: 30
